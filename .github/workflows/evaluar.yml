# El harness como puerta: si un cambio en el SQL degrada el ranking, no pasa.
name: evaluar
on: [push, pull_request]
jobs:
  evaluar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ingesta/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: ingesta
      - run: pnpm evaluar
        working-directory: ingesta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
